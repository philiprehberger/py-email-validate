[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philiprehberger-email-validate"
version = "0.3.1"
description = "Email validation with syntax checking and normalization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Philip Rehberger" }]
keywords = ["email", "validation", "normalize", "domain", "rfc5322"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/philiprehberger/py-email-validate#readme"
Repository = "https://github.com/philiprehberger/py-email-validate"
Issues = "https://github.com/philiprehberger/py-email-validate/issues"
Changelog = "https://github.com/philiprehberger/py-email-validate/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/philiprehberger_email_validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
